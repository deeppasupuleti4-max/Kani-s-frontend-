 y="500" width="169" height="28" rx="14" fill="#17704e"/><text x="39" y="519" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Borders with detail</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="26" y="552">Fine zari and careful</tspan><tspan x="26" y="568">finishing frame the drape.</tspan></text><line x1="364" y1="259" x2="316" y2="262" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-k)"/><rect x="364" y="245" width="176" height="28" rx="14" fill="#17704e"/><text x="379" y="264" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Pallu that sits well</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="297">Balanced weight rests softly</tspan><tspan x="366" y="313">on the shoulder.</tspan></text><line x1="364" y1="394" x2="304" y2="382" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-k)"/><rect x="364" y="380" width="147" height="28" rx="14" fill="#17704e"/><text x="379" y="399" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Pleats that hold</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="432">Crisp folds stay neat from</tspan><tspan x="366" y="448">the first ritual to the last.</tspan></text><line x1="364" y1="554" x2="338" y2="542" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-k)"/><rect x="364" y="540" width="118" height="28" rx="14" fill="#17704e"/><text x="379" y="559" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Easy all day</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="592">Comfortable to wear, walk</tspan><tspan x="366" y="608">and celebrate in.</tspan></text><line x1="70" y1="816" x2="188" y2="816" stroke="#17704e" stroke-width="1" opacity=".6"/><line x1="372" y1="816" x2="490" y2="816" stroke="#17704e" stroke-width="1" opacity=".6"/><text x="280" y="796" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#3a2f25">Not just about how it looks — it’s about how it feels,</text><text x="280" y="822" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="20" fill="#17704e">and this is it.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>