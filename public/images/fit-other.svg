"/><text x="39" y="209" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Dull, fading colour</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="26" y="242">Shades look flat and fade</tspan><tspan x="26" y="258">after a few washes.</tspan></text><line x1="164" y1="354" x2="222" y2="402" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-o)"/><rect x="24" y="340" width="140" height="28" rx="14" fill="#17704e"/><text x="39" y="359" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Scratchy fabric</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="26" y="392">Heavy, stiff weave that</tspan><tspan x="26" y="408">itches by the afternoon.</tspan></text><line x1="193" y1="514" x2="210" y2="600" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-o)"/><rect x="24" y="500" width="169" height="28" rx="14" fill="#17704e"/><text x="39" y="519" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Plain, flat borders</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="26" y="552">Little detail, so the drape</tspan><tspan x="26" y="568">looks ordinary up close.</tspan></text><line x1="364" y1="259" x2="316" y2="262" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-o)"/><rect x="364" y="245" width="176" height="28" rx="14" fill="#17704e"/><text x="379" y="264" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Pallu keeps slipping</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="297">Slides off the shoulder, so</tspan><tspan x="366" y="313">you keep pinning it back.</tspan></text><line x1="364" y1="394" x2="304" y2="382" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-o)"/><rect x="364" y="380" width="154" height="28" rx="14" fill="#17704e"/><text x="379" y="399" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Pleats lose shape</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="432">Crumple and spread out</tspan><tspan x="366" y="448">after sitting or travelling.</tspan></text><line x1="364" y1="554" x2="338" y2="542" stroke="#17704e" stroke-width="1.4" marker-end="url(#arrow-o)"/><rect x="364" y="540" width="183" height="28" rx="14" fill="#17704e"/><text x="379" y="559" fill="#fff8eb" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="13.5">Needs constant fixing</text><text font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#4d4a42"><tspan x="366" y="592">Always adjusting, which is</tspan><tspan x="366" y="608">tiring at long functions.</tspan></text><line x1="70" y1="816" x2="188" y2="816" stroke="#17704e" stroke-width="1" opacity=".6"/><line x1="372" y1="816" x2="490" y2="816" stroke="#17704e" stroke-width="1" opacity=".6"/><text x="280" y="796" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#3a2f25">Not just about how it looks — it’s about how it feels,</text><text x="280" y="822" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="20" fill="#17704e">and this isn't it.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>